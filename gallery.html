<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Djack – Gallery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #ffffff;
            line-height: 1.6;
            min-height: 100vh;
            background-image:
                radial-gradient(1.5px 1.5px at 10% 15%, rgba(255, 255, 255, 0.4), transparent),
                radial-gradient(1.5px 1.5px at 25% 40%, rgba(255, 255, 255, 0.3), transparent),
                radial-gradient(1.5px 1.5px at 40% 8%, rgba(255, 255, 255, 0.5), transparent),
                radial-gradient(1.5px 1.5px at 55% 65%, rgba(255, 255, 255, 0.2), transparent),
                radial-gradient(1.5px 1.5px at 70% 25%, rgba(255, 255, 255, 0.4), transparent),
                radial-gradient(1.5px 1.5px at 85% 75%, rgba(255, 255, 255, 0.3), transparent),
                radial-gradient(1.5px 1.5px at 15% 85%, rgba(255, 255, 255, 0.25), transparent),
                radial-gradient(1.5px 1.5px at 50% 50%, rgba(255, 255, 255, 0.15), transparent),
                radial-gradient(1.5px 1.5px at 65% 12%, rgba(255, 255, 255, 0.4), transparent),
                radial-gradient(1.5px 1.5px at 90% 50%, rgba(255, 255, 255, 0.3), transparent),
                radial-gradient(1.5px 1.5px at 5% 55%, rgba(255, 255, 255, 0.25), transparent),
                radial-gradient(1.5px 1.5px at 75% 88%, rgba(255, 255, 255, 0.2), transparent),
                radial-gradient(2px 2px at 20% 45%, rgba(245, 158, 11, 0.3), transparent),
                radial-gradient(2px 2px at 60% 35%, rgba(245, 158, 11, 0.25), transparent),
                radial-gradient(2px 2px at 80% 65%, rgba(245, 158, 11, 0.3), transparent),
                radial-gradient(2px 2px at 30% 90%, rgba(245, 158, 11, 0.2), transparent),
                radial-gradient(2px 2px at 70% 10%, rgba(245, 158, 11, 0.25), transparent),
                radial-gradient(2px 2px at 50% 70%, rgba(245, 158, 11, 0.2), transparent);
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        img {
            max-width: 100%;
            display: block;
        }

        /* ===== HEADER ===== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 20px 0;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(245, 158, 11, 0.1);
            transition: all 0.3s;
        }
        .header.scrolled {
            padding: 12px 0;
            background: rgba(15, 23, 42, 0.98);
        }
        .header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo a {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        .logo a span {
            color: #f59e0b;
        }
        .nav {
            display: flex;
            align-items: center;
            gap: 32px;
        }
        .nav a {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            transition: color 0.3s;
            position: relative;
        }
        .nav a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #f59e0b, #d97706);
            transition: width 0.3s;
        }
        .nav a:hover::after,
        .nav a.active::after {
            width: 100%;
        }
        .nav a:hover {
            color: #f59e0b;
        }
        .nav-cta {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #0f172a !important;
            padding: 8px 24px;
            border-radius: 50px;
            font-weight: 600 !important;
            transition: all 0.3s;
        }
        .nav-cta::after {
            display: none !important;
        }
        .nav-cta:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.3);
            color: #0f172a !important;
        }

        /* ===== HAMBURGER ===== */
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px;
            z-index: 1001;
        }
        .hamburger span {
            display: block;
            width: 28px;
            height: 2.5px;
            background: #f59e0b;
            border-radius: 2px;
            transition: all 0.3s;
        }
        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }
        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        /* ===== MOBILE NAV ===== */
        .mobile-nav {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(12px);
            padding: 100px 24px 40px;
            z-index: 999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }
        .mobile-nav.active {
            display: flex;
        }
        .mobile-nav a {
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.6);
            transition: color 0.3s;
        }
        .mobile-nav a:hover {
            color: #f59e0b;
        }
        .mobile-nav .nav-cta-mobile {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #0f172a !important;
            padding: 10px 30px;
            border-radius: 50px;
            font-weight: 600 !important;
        }

        /* ===== PAGE HERO ===== */
        .page-hero {
            padding: 140px 0 60px;
            text-align: center;
            background: transparent;
            border-bottom: 1px solid rgba(245, 158, 11, 0.06);
        }
        .page-hero h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 700;
            margin-bottom: 12px;
            color: #ffffff;
        }
        .page-hero h1 span {
            color: #f59e0b;
        }
        .page-sub {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.4);
        }

        /* ===== GALLERY ===== */
        .gallery-page {
            padding: 60px 0 80px;
            background: transparent;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }
        .gallery-item {
            overflow: hidden;
            border-radius: 12px;
            aspect-ratio: 1/1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(245, 158, 11, 0.06);
            transition: all 0.4s;
            cursor: pointer;
            position: relative;
        }
        .gallery-item:hover {
            border-color: rgba(245, 158, 11, 0.25);
            transform: translateY(-6px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }
        .gallery-item:hover img {
            transform: scale(1.05);
        }

        /* ===== LIGHTBOX ===== */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            animation: fadeIn 0.3s ease;
        }
        .lightbox.active {
            display: flex;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.8);
        }
        .lightbox-close {
            position: absolute;
            top: 24px;
            right: 32px;
            font-size: 2.5rem;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: color 0.3s;
            background: none;
            border: none;
        }
        .lightbox-close:hover {
            color: #fff;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ===== FOOTER ===== */
        .footer {
            padding: 32px 0;
            background: rgba(0, 0, 0, 0.3);
            text-align: center;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.2);
            border-top: 1px solid rgba(245, 158, 11, 0.06);
        }
        .footer a {
            color: #f59e0b;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .nav {
                display: none;
            }
            .hamburger {
                display: flex;
            }
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
        }
        @media (max-width: 480px) {
            .page-hero h1 {
                font-size: 2rem;
            }
            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

    <script>
        const hamburger = document.getElementById('hamburger');
        const mobileNav = document.getElementById('mobileNav');
        const body = document.body;
        const header = document.getElementById('header');

        // Hamburger menu
        hamburger.addEventListener('click', function(e) {
            e.stopPropagation();
            this.classList.toggle('active');
            mobileNav.classList.toggle('active');
            body.style.overflow = mobileNav.classList.contains('active') ? 'hidden' : '';
        });

        mobileNav.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function() {
                hamburger.classList.remove('active');
                mobileNav.classList.remove('active');
                body.style.overflow = '';
            });
        });

        document.addEventListener('click', function(e) {
            if (mobileNav.classList.contains('active') &&
                !mobileNav.contains(e.target) &&
                !hamburger.contains(e.target)) {
                hamburger.classList.remove('active');
                mobileNav.classList.remove('active');
                body.style.overflow = '';
            }
        });

        // Header scroll effect
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        // ===== LIGHTBOX =====
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightboxImage');
        const lightboxClose = document.getElementById('lightboxClose');

        document.querySelectorAll('.gallery-item').forEach(item => {
            item.addEventListener('click', function() {
                const img = this.querySelector('img');
                if (img) {
                    lightboxImage.src = img.src;
                    lightboxImage.alt = img.alt || 'Tattoo preview';
                    lightbox.classList.add('active');
                    body.style.overflow = 'hidden';
                }
            });
        });

        function closeLightbox() {
            lightbox.classList.remove('active');
            body.style.overflow = '';
        }

        lightboxClose.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', function(e) {
            if (e.target === this) closeLightbox();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeLightbox();
        });
    </script>
